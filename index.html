<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>രസതന്ത്രം - മോഡൽ എക്സാം</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Noto+Sans+Malayalam:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    body { font-family: 'Noto Sans Malayalam', 'Manrope', sans-serif; }
    .custom-scroll::-webkit-scrollbar { width: 6px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between select-none">

  <!-- Header -->
  <header class="bg-slate-800/95 backdrop-blur border-b border-slate-700 px-4 sm:px-6 py-3 flex items-center justify-between sticky top-0 z-50">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-violet-500 to-fuchsia-600 flex items-center justify-center font-black text-xl shadow-lg text-white">
        PSC
      </div>
      <div>
        <h1 id="headerExamTitle" class="font-bold text-base sm:text-lg text-violet-400 leading-tight">രസതന്ത്രം (Chemistry Part 1)</h1>
        <p class="text-xs text-slate-400">Special Notes by Subhash Kumar | 50 ചോദ്യങ്ങൾ (50 മിനിറ്റ്)</p>
      </div>
    </div>
    <div class="text-right">
      <span id="displayUser" class="text-xs sm:text-sm font-semibold text-slate-200">പരീക്ഷാർത്ഥി</span>
      <p class="text-[10px] text-emerald-400 font-mono">+1.00 / -0.33 Mark</p>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 flex flex-col items-center justify-center p-3 sm:p-6 w-full max-w-5xl mx-auto">
    
    <!-- Quiz Screen -->
    <div id="quizScreen" class="w-full flex flex-col space-y-4">
      <div class="bg-slate-800 border border-slate-700 rounded-xl p-3 sm:p-4 flex flex-wrap items-center justify-between gap-3 shadow-md">
        <div class="flex items-center space-x-3">
          <span class="px-3 py-1 bg-violet-500/20 text-violet-300 font-bold rounded-lg text-xs sm:text-sm" id="questionBadge">ചോദ്യം 1 / 50</span>
        </div>
        <div class="flex items-center space-x-2 bg-slate-900/90 border border-slate-700 px-3.5 py-1 rounded-xl">
          <span class="text-xs text-slate-400">സമയം:</span>
          <span id="examTimer" class="font-mono text-sm font-black text-violet-400">50:00</span>
        </div>
        <button type="button" onclick="finishExam()" class="px-3.5 py-1.5 bg-rose-500/20 hover:bg-rose-500/30 text-rose-300 border border-rose-500/30 text-xs font-semibold rounded-lg">
          ഫിനിഷ് ചെയ്യുക
        </button>
      </div>

      <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 sm:p-8 shadow-2xl relative">
        <div class="mb-6">
          <h2 id="qText" class="text-base sm:text-lg font-semibold leading-relaxed text-slate-100">ചോദ്യം ലോഡ് ആകുന്നു...</h2>
        </div>

        <div id="optionsContainer" class="space-y-3 mb-8"></div>

        <div class="flex flex-wrap items-center justify-between gap-3 pt-4 border-t border-slate-700">
          <button type="button" id="prevBtn" onclick="prevQuestion()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs sm:text-sm font-semibold rounded-xl">
            ‹ Previous
          </button>
          <button type="button" id="nextBtn" onclick="nextQuestion()" class="px-5 py-2 bg-violet-500 hover:bg-violet-600 text-white font-bold text-xs sm:text-sm rounded-xl">
            Next ›
          </button>
        </div>
      </div>
    </div>

    <!-- Result Screen -->
    <div id="resultScreen" class="w-full hidden space-y-6">
      <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 sm:p-8 shadow-2xl text-center space-y-5">
        <div class="flex justify-end">
          <button type="button" onclick="returnToHomeWithData()" class="px-4 py-2 bg-violet-500 hover:bg-violet-400 text-slate-950 font-black rounded-xl text-xs transition shadow">
            🏠 ഹോം പേജിലേക്ക് മടങ്ങുക (Save Result)
          </button>
        </div>

        <h2 class="text-2xl sm:text-3xl font-black text-violet-400 mb-1">പരീക്ഷാ ഫലം (Exam Result)</h2>
        
        <div class="grid grid-cols-3 gap-3 max-w-lg mx-auto">
          <div class="bg-slate-900/80 p-3 rounded-xl border border-slate-700">
            <span class="text-xs text-slate-400 block uppercase">സ്കോർ</span>
            <span id="finalScore" class="text-2xl font-black text-violet-400 font-mono">0.00</span>
          </div>
          <div class="bg-slate-900/80 p-3 rounded-xl border border-emerald-900/50">
            <span class="text-xs text-emerald-400 block uppercase">ശരി</span>
            <span id="correctCount" class="text-xl font-bold text-emerald-400 font-mono">0</span>
          </div>
          <div class="bg-slate-900/80 p-3 rounded-xl border border-rose-900/50">
            <span class="text-xs text-rose-400 block uppercase">തെറ്റ്</span>
            <span id="wrongCount" class="text-xl font-bold text-rose-400 font-mono">0</span>
          </div>
        </div>

        <button type="button" onclick="returnToHomeWithData()" class="px-6 py-3 bg-slate-700 hover:bg-slate-600 text-white font-bold rounded-xl text-sm">
          🏠 ഹോം പോർട്ടലിലേക്ക് തിരികെ പോവുക
        </button>
      </div>
    </div>

  </main>

  <script>
    // മുഴുവൻ 50 ചോദ്യങ്ങളും ഇവിടെ ഉൾപ്പെടുത്തിയിരിക്കുന്നു
    const questionsData = [
      { q: "ആറ്റത്തെ പോസിറ്റീവ് ചാർജ്ജുള്ള ഗോളമായും ഇലക്ട്രോണുകളെ അതിൽ പതിഞ്ഞുകിടക്കുന്നതായും വിഭാവനം ചെയ്ത 'പ്ലം പുഡ്ഡിംഗ് മോഡൽ' ആവിഷ്കരിച്ചത് ആര്?", options: ["ജോൺ ഡാൽട്ടൺ", "ജെ.ജെ. തോംസൺ", "ഏണസ്റ്റ് റൂഥർഫോർഡ്", "നീൽസ് ബോർ"], ans: 1, exp: "1897-ൽ ഇലക്ട്രോൺ കണ്ടെത്തിയ ജെ.ജെ. തോംസൺ ആണ് പ്ലം പുഡ്ഡിംഗ് മോഡൽ അവതരിപ്പിച്ചത്[cite: 3]." },
      { q: "സ്വർണ്ണത്തകിട് ആൽഫാ കണ പരീക്ഷണത്തിലൂടെ ആറ്റത്തിന് ഒരു പോസിറ്റീവ് ന്യൂക്ലിയസ് ഉണ്ടെന്ന് കണ്ടെത്തിയത് ആര്?", options: ["നീൽസ് ബോർ", "ജെയിംസ് ചാഡ്വിക്", "ഏണസ്റ്റ് റൂഥർഫോർഡ്", "മാക്സ് പ്ലാങ്ക്"], ans: 2, exp: "1911-ൽ റൂഥർഫോർഡ് നടത്തിയ ആൽഫാ കണ വിസരണ പരീക്ഷണമാണിത്[cite: 3]." },
      { q: "ആറ്റത്തിലെ ഇലക്ട്രോണുകൾ ന്യൂക്ലിയസിന് ചുറ്റും നിശ്ചിത ഊർജ്ജമുള്ള വൃത്താകാര പാതകളിൽ (ഓർബിറ്റുകൾ) കറങ്ങുന്നു എന്ന ആറ്റം മാതൃക മുന്നോട്ടുവെച്ചത് ആര്?", options: ["റൂഥർഫോർഡ്", "നീൽസ് ബോർ", "ജെ.ജെ. തോംസൺ", "ലൂയി ഡിബ്രോളി"], ans: 1, exp: "1913-ൽ നീൽസ് ബോറാണ് ഊർജ്ജ നിലകൾ അടങ്ങിയ ആറ്റം മാതൃക അവതരിപ്പിച്ചത്[cite: 3]." },
      { q: "ആധുനിക പീരിയോഡിക് ടേബിളിൽ മൂലകങ്ങളെ അവയുടെ ഏത് ക്രമത്തിലാണ് ക്രമീകരിച്ചിരിക്കുന്നത്?", options: ["അറ്റോമിക മാസ് വർദ്ധിക്കുന്ന ക്രമത്തിൽ", "അറ്റോമിക നമ്പർ വർദ്ധിക്കുന്ന ക്രമത്തിൽ", "അയോണീകരണ ഊർജ്ജം കുറയുന്ന ക്രമത്തിൽ", "സാന്ദ്രത വർദ്ധിക്കുന്ന ക്രമത്തിൽ"], ans: 1, exp: "ഹെൻറി മോസ്ലിയുടെ ആധുനിക നിയമപ്രകാരം അറ്റോമിക നമ്പറുകളുടെ ആവർത്തന ഫലമായാണ് ക്രമീകരിച്ചിരിക്കുന്നത്[cite: 3]." },
      { q: "പീരിയോഡിക് ടേബിളിൽ ഒരു പിരീഡിൽ ഇടത്തുനിന്ന് വലത്തോട്ട് നീങ്ങുമ്പോൾ അറ്റോമിക ആരം സാധാരണയായി എങ്ങനെ വ്യത്യാസപ്പെടുന്നു?", options: ["ക്രമമായി വർദ്ധിക്കുന്നു", "ക്രമമായി കുറയുന്നു", "മാറ്റമില്ലാതെ തുടരുന്നു", "ആദ്യം കുറഞ്ഞ് പിന്നീട് കൂടുന്നു"], ans: 1, exp: "ന്യൂക്ലിയർ ചാർജ്ജ് വർദ്ധിക്കുന്നതിനാൽ പിരീഡിൽ ഇടത്തുനിന്ന് വലത്തോട്ട് അറ്റോമിക ആരം കുറയുന്നു[cite: 3]." },
      { q: "പീരിയോഡിക് ടേബിളിൽ ഏറ്റവും കൂടുതൽ അയോണീകരണ എന്താൽപ്പി ഉള്ള മൂലകം ഏതാണ്?", options: ["ഫ്ലൂറിൻ", "ഹൈഡ്രജൻ", "ഹീലിയം", "സീസിയം"], ans: 2, exp: "സ്ഥിരതയുള്ള ഇരട്ട ഇലക്ട്രോൺ വിന്യാസമുള്ള ഹീലിയത്തിനാണ് ഏറ്റവും ഉയർന്ന അയോണീകരണ ഊർജ്ജമുള്ളത്[cite: 3]." },
      { q: "പീരിയോഡിക് ടേബിളിൽ ഏറ്റവും കുറഞ്ഞ അയോണീകരണ എന്താൽപ്പിയുള്ള മൂലകം ഏത്?", options: ["ലിഥിയം", "ഫ്രാൻസിയം", "സീസിയം", "പൊട്ടാസ്യം"], ans: 2, exp: "റേഡിയോ ആക്ടീവല്ലാത്ത മൂലകങ്ങളിൽ സീസിയത്തിന് ഏറ്റവും കുറഞ്ഞ അയോണീകരണ എന്താൽപ്പിയാണുള്ളത്[cite: 3]." },
      { q: "പോളിംഗ് സ്കെയിൽ പ്രകാരം പീരിയോഡിക് ടേബിളിൽ ഏറ്റവും കൂടുതൽ ഇലക്ട്രോനെഗറ്റിവിറ്റി ഉള്ള മൂലകം ഏതാണ്?", options: ["ക്ലോറിൻ", "ഓക്സിജൻ", "ഫ്ലൂറിൻ", "നൈട്രജൻ"], ans: 2, exp: "ഇലക്ട്രോനെഗറ്റിവിറ്റി ഏറ്റവും കൂടുതൽ ഫ്ലൂറിനാണ് (4.0)[cite: 3]." },
      { q: "പീരിയോഡിക് ടേബിളിൽ ഏറ്റവും കൂടുതൽ ഇലക്ട്രോൺ അഫിനിറ്റി പ്രകടിപ്പിക്കുന്ന മൂലകം ഏതാണ്?", options: ["ഫ്ലൂറിൻ", "ക്ലോറിൻ", "ബ്രോമിൻ", "അയോഡിൻ"], ans: 1, exp: "ഫ്ലൂറിനേക്കാൾ ഉയർന്ന ഇലക്ട്രോൺ സ്വീകരണ എന്താൽപ്പി ക്ലോറിനാണ്[cite: 3]." },
      { q: "പീരിയോഡിക് ടേബിളിലെ 18-ാം ഗ്രൂപ്പ് മൂലകങ്ങൾ ഏത് ബ്ലോക്കിലാണ് ഉൾപ്പെടുന്നത്?", options: ["s-ബ്ലോക്ക്", "p-ബ്ലോക്ക്", "d-ബ്ലോക്ക്", "f-ബ്ലോക്ക്"], ans: 1, exp: "ഉത്കൃഷ്ട വാതകങ്ങൾ p-ബ്ലോക്കിലാണ് ഉൾപ്പെടുന്നത്[cite: 3]." },
      { q: "സംക്രമണ മൂലകങ്ങൾ പീരിയോഡിക് ടേബിളിലെ ഏത് ബ്ലോക്കിലാണ് ഉൾപ്പെടുന്നത്?", options: ["s-ബ്ലോക്ക്", "p-ബ്ലോക്ക്", "d-ബ്ലോക്ക്", "f-ബ്ലോക്ക്"], ans: 2, exp: "3 മുതൽ 12 വരെയുള്ള ഗ്രൂപ്പുകളിലെ മൂലകങ്ങളാണ് d-ബ്ലോക്ക് അഥവാ സംക്രമണ മൂലകങ്ങൾ[cite: 3]." },
      { q: "ഒരു നിശ്ചിത താപനിലയിൽ കൂടുതൽ ലീനം ലയിച്ചുചേരാൻ സാധിക്കാത്ത വിധം പരമാവധി ലീനം അടങ്ങിയിരിക്കുന്ന ലായനി ഏത്?", options: ["അപൂരിത ലായനി", "പൂരിത ലായനി", "അതിപൂരിത ലായനി", "നേർപ്പിച്ച ലായനി"], ans: 1, exp: "ഇത് പൂരിത ലായനി (Saturated Solution) എന്നറിയപ്പെടുന്നു[cite: 3]." },
      { q: "ദ്രാവക ലായകത്തിൽ ഒരു വാതക ലീനത്തിന്റെ ലേയത്വം മർദ്ദത്തിന് നേർ അനുപാതത്തിലായിരിക്കും എന്ന് വ്യക്തമാക്കുന്ന നിയമം ഏത്?", options: ["ബോയിൽ നിയമം", "ഹെൻറി നിയമം", "ചാൾസ് നിയമം", "റൗൾട്ട് നിയമം"], ans: 1, exp: "ഇത് ഹെൻറി നിയമം ആകുന്നു[cite: 3]." },
      { q: "കൊളോയിഡൽ കണികകളിലൂടെ പ്രകാശകിരണങ്ങൾ കടന്നുപോകുമ്പോൾ പ്രകാശപാത ദൃശ്യമാകുന്ന പ്രതിഭാസം ഏത്?", options: ["ബ്രൗണിയൻ ചലനം", "ടിൻഡൽ പ്രഭാവം", "ഇലക്ട്രോഫോറെസിസ്", "ഡയാലിസിസ്"], ans: 1, exp: "പ്രകാശ വിസരണ പ്രതിഭാസമായ ടിൻഡൽ പ്രഭാവം[cite: 3]." },
      { q: "ഒരു കൊളോയിഡൽ ലായനിയിൽ കണികകൾ നടത്തുന്ന ക്രമരഹിത ചലനത്തിന് പറയുന്ന പേരെന്ത്?", options: ["ടിൻഡൽ ചലനം", "ബ്രൗണിയൻ ചലനം", "അയോണീകരണം", "സബ്ളിമേഷൻ"], ans: 1, exp: "ഇത് ബ്രൗണിയൻ മൂവ്മെന്റ് ആകുന്നു[cite: 3]." },

    let candidateName = "പരീക്ഷാർത്ഥി";
    let candidatePhone = "0000000000";
    let examTitle = "രസതന്ത്രം - മോഡൽ എക്സാം";
    let currentIndex = 0;
    let userAnswers = new Array(questionsData.length).fill(null);
    let timeLeft = 50 * 60;
    let timerInterval = null;

    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('name')) candidateName = decodeURIComponent(urlParams.get('name'));
      if (urlParams.get('phone')) candidatePhone = decodeURIComponent(urlParams.get('phone'));
      if (urlParams.get('title')) examTitle = decodeURIComponent(urlParams.get('title'));

      document.getElementById('displayUser').innerText = `${candidateName}`;
      renderQuestion(0);
      startTimer();
    });

    function startTimer() {
      const timerDisplay = document.getElementById('examTimer');
      timerInterval = setInterval(() => {
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          alert('അനുവദിച്ച 50 മിനിറ്റ് സമയം പൂർത്തിയായിരിക്കുന്നു!');
          finishExam();
          return;
        }
        timeLeft--;
        const m = Math.floor(timeLeft / 60);
        const s = timeLeft % 60;
        timerDisplay.innerText = `${m < 10 ? '0' + m : m}:${s < 10 ? '0' + s : s}`;
      }, 1000);
    }

    function renderQuestion(index) {
      const q = questionsData[index];
      document.getElementById('questionBadge').innerText = `ചോദ്യം ${index + 1} / ${questionsData.length}`;
      document.getElementById('qText').innerText = `${index + 1}. ${q.q}`;

      const optionsDiv = document.getElementById('optionsContainer');
      optionsDiv.innerHTML = '';
      const letters = ['A', 'B', 'C', 'D'];

      q.options.forEach((opt, idx) => {
        const isSelected = userAnswers[index] === idx;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `w-full text-left p-4 rounded-xl border transition flex items-start space-x-3 ${
          isSelected ? 'bg-violet-500/20 border-violet-500 text-violet-200' : 'bg-slate-900/60 border-slate-700 text-slate-200'
        }`;
        btn.innerHTML = `<span class="font-bold">${letters[idx]})</span> <span>${opt}</span>`;
        btn.onclick = () => {
          userAnswers[index] = idx;
          renderQuestion(index);
        };
        optionsDiv.appendChild(btn);
      });

      document.getElementById('prevBtn').disabled = (index === 0);
      document.getElementById('nextBtn').innerText = (index === questionsData.length - 1) ? "സബ്മിറ്റ് ചെയ്യുക ✓" : "Next ›";
    }

    document.getElementById('nextBtn').onclick = () => {
      if (currentIndex < questionsData.length - 1) {
        currentIndex++;
        renderQuestion(currentIndex);
      } else {
        finishExam();
      }
    };

    document.getElementById('prevBtn').onclick = () => {
      if (currentIndex > 0) {
        currentIndex--;
        renderQuestion(currentIndex);
      }
    };

    document.getElementById('skipBtn').onclick = () => {
      userAnswers[currentIndex] = null;
      if (currentIndex < questionsData.length - 1) {
        currentIndex++;
        renderQuestion(currentIndex);
      } else {
        finishExam();
      }
    };

    document.getElementById('finishMidBtn').onclick = () => {
      if (confirm('പരീക്ഷ അവസാനിപ്പിക്കണമെന്നുറപ്പാണോ?')) {
        finishExam();
      }
    };

    function finishExam() {
      if (timerInterval) clearInterval(timerInterval);

      let correct = 0, wrong = 0, skipped = 0;
      for (let i = 0; i < questionsData.length; i++) {
        if (userAnswers[i] === null) skipped++;
        else if (userAnswers[i] === questionsData[i].ans) correct++;
        else wrong++;
      }

      let netScore = (correct * 1.0) - (wrong * 0.33);
      if (netScore < 0) netScore = 0;
      const formattedScore = netScore.toFixed(2);

      document.getElementById('finalScore').innerText = formattedScore;
      document.getElementById('correctCount').innerText = correct;
      document.getElementById('wrongCount').innerText = wrong;

      // പ്രൊഫൈൽ ഹിസ്റ്ററിയിലേക്ക് സേവ് ചെയ്യുന്നു
      try {
        if (candidatePhone && candidatePhone !== "0000000000") {
          const historyKey = `sk_history_${candidatePhone}`;
          let history = JSON.parse(localStorage.getItem(historyKey) || '[]');
          history.push({
            title: examTitle,
            score: formattedScore,
            correct: correct,
            wrong: wrong,
            skipped: skipped,
            date: new Date().toLocaleDateString('ml-IN', { day: 'numeric', month: 'short', year: 'numeric' })
          });
          localStorage.setItem(historyKey, JSON.stringify(history));
        }
      } catch (err) {}

      document.getElementById('quizScreen').classList.add('hidden');
      document.getElementById('resultScreen').classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function returnToHomeWithData() {
      const homePortalUrl = "https://subhash-kumar00.github.io/PSC-EXAMS/";
      const score = document.getElementById('finalScore').innerText;
      const correct = document.getElementById('correctCount').innerText;
      const wrong = document.getElementById('wrongCount').innerText;
      const skipped = document.getElementById('skipCount').innerText;

      window.location.href = `${homePortalUrl}?completed=true&title=${encodeURIComponent(examTitle)}&score=${score}&correct=${correct}&wrong=${wrong}&skipped=${skipped}`;
    }
  </script>
</body>
</html>
